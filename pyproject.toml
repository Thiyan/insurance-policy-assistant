[project]
name = "insurance-policy-assistant"
version = "0.1.0"
description = "AI-powered insurance policy assistant"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "chromadb>=1.5.9",
    "onnxruntime<1.26.0",
    "fastapi>=0.136.1",
    "langchain>=1.2.17",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.2.1",
    "langchain-text-splitters>=1.1.2",
    "openai>=2.35.1",
    "pydantic>=2.13.4",
    "pymupdf4llm>=1.27.2.3",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "isort>=8.0.1",
]

eval = [
    "datasets>=4.8.5",
    "ragas>=0.4.3",
    "sentence-transformers>=5.4.1",
]